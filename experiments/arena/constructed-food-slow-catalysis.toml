# Slower catalysis explores overlapping production, sorption and transport scales.
# Only catalytic efficiency differs from constructed-food.toml; no optimum implied.
# Ready-made food is a finite bootstrap; continued external supply is raw feedstock.
# Shared construction may close the food-release loop without soluble feeding.
# Slower paid motility and a longer-lived matrix allow inhabitation of a place;
# neither settlement nor producer/consumer identities are prescribed.
model = "catalytic"
seed = 211
dt = 0.1
snapshot_seconds = 2.0
checkpoint_seconds = 90.0
batch = 5
sleep_seconds = 0.001
[grid]
shape = [32, 32, 1]
extent = [16.0, 16.0, 1.0]
[cellular]
population = 48
capacity = 1536
hidden = 8
exchange_radius = 1.0
junction_rate = 0.8
speed = 0.3
basal_rate = 0.025
mutation = 0.08
mutation_probability = 0.03
[resources]
names = ["precursor_a", "precursor_b", "waste"]
potentials = [4.0, 4.0, 0.0]
initial = [0.3, 0.3, 0.0]
diffusion = [0.2, 0.2, 0.03]
source_rates = [0.0, 0.0, 0.0]
source_budgets = [0.0, 0.0, 0.0]
sink_rates = [0.0008, 0.0008, 0.01]
sink_budgets = [100000.0, 100000.0, 100000.0]
spatial_niches = true
niche_waves = [1, 2, 0]
niche_contrast = 0.8
[feedstock]
