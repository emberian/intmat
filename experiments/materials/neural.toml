# Fixed recurrent neural material rule. Latents evolve; weights are not trained.
[simulation]
resolution = 40
dimension = 3
seed = 31
steps = 900
dt = 0.01

[neural]
enabled = true
mode = "oscillator"
gain = 1.2
response_time = 0.5
diffusion = 0.003
material_feedback = 0.7
nutrient_feedback = 0.3
pressure_feedback = 0.4
initial_noise = 0.04

[excitable]
enabled = false

[wave]
enabled = true

[transport]
rate = 0.002

[deposition]
rate = 0.6
threshold = 0.25
dissolution = 0.002

[particles]
count = 0
